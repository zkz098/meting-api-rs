[package]
name = "meting-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
base64 = "0.22"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
num-bigint = "0.4"
hex = "0.4"
md-5 = "0.10"
