[package]
name = "meting-api-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust Meting API for Cloudflare Workers and Vercel"

[lib]
crate-type = ["rlib"]
# worker crate (crates/worker) is the only cdylib for wasm; root is rlib dummy to satisfy virtual-manifest parsing

[workspace]
members = ["crates/core", "crates/server", "crates/worker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your/meting-api-rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
